     version: '3.8'

     services:
       web:
         build:
           context: .
           dockerfile: Dockerfile
         ports:
           - "8000:8000"
         environment:
           - DEBUG=True
         logging:
           driver: loki
           options:
             loki-url: "http://loki:3100/loki/api/v1/push"

       grafana:
         image: grafana/grafana
         ports:
           - "3000:3000"
         depends_on:
           - loki

       loki:
         image: grafana/loki
         ports:
           - "3100:3100"
