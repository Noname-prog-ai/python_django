{% extends 'shopapp/base.html' %}

{% block content %}
<h1>{% if form.instance.id %}Edit Product{% else %}Create Product{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'products_list' %}">Cancel</a>
{% endblock %}
