{% extends 'shopapp/base.html' %}

{% block content %}
<h1>{{ product.name }}</h1>
<p>Price: ${{ product.price }}</p>
<a href="{% url 'product_update' product.id %}">Edit</a> |
<a href="{% url 'product_delete' product.id %}">Delete</a> |
<a href="{% url 'products_list' %}">Back to Products</a>
{% endblock %}
