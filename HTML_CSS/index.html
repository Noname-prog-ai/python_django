<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Подключаем файл стилей -->
    <title>Вёрстка страницы</title>
</head>
<body>

<header>
    <nav>
        <a href="#">Главная</a>
        <a href="#">Услуги</a>
        <a href="#">Портфолио</a>
        <a href="#">Контакты</a>
    </nav>
</header>

<div class="first-block">
    <h1>Заголовок первого блока</h1>
    <h2>Подзаголовок</h2>
    <button class="button">Кнопка</button>
</div>

<div class="work-examples">
    <div class="example-item"><img src="HTML_CSS/file/image1.jpg" alt="Пример работы 1"></div>
    <div class="example-item"><img src="HTML_CSS/file/image2.jpg" alt="Пример работы 2"></div>
    <div class="example-item"><img src="HTML_CSS/file/image3.jpg" alt="Пример работы 3"></div>
</div>


<div class="blue-block">
    <h2>Синий блок</h2>
    <p>Мелкий текст под заголовком.</p>
</div>

<footer>
    <div class="footer-menu">Меню</div>
    <div class="footer-contacts">Контакты</div>
    <div class="footer-social">Социальные сети</div>
</footer>

<div class="popup-container" style="display: none;">
    <input type="text" placeholder="Введите ваше имя">
    <input type="email" placeholder="Введите ваш email">
    <button>Отправить</button>
</div>

<script defer src="script.js"></script> <!-- Подключаем файл со скриптами -->
</body>
</html>
