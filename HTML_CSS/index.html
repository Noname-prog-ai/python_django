<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваш заголовок страницы</title>
    <!-- Подключение шрифта Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Подключение файла стилей -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Услуги</a>
            <a href="#">Портфолио</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <div class="first-block">
        <h1>Заголовок первого блока</h1>
        <h2>Подзаголовок</h2>
        <button class="open-popup">Открыть форму</button>
    </div>

    <div class="works">
        <div class="work-item"><img src="work1.jpg" alt="Работа 1"></div>
        <div class="work-item"><img src="work2.jpg" alt="Работа 2"></div>
        <div class="work-item"><img src="work3.jpg" alt="Работа 3"></div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#">Политика конфиденциальности</a>
            <a href="#">Условия использования</a>
        </div>
    </footer>

    <!-- Подключение файла скриптов -->
    <script defer src="scripts.js"></script>
</body>
</html>
