<!DOCTYPE html>
<html>
<head>
    <title>Размеры и отступы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script> <!-- Подключение файла со скриптами -->
</head>
<body>
    <div class="popup-container">
        <form class="popup">
            <input type="text" placeholder="Введите ваше имя">
            <input type="email" placeholder="Введите ваш Email">
            <button type="submit">Отправить</button>
        </form>
    </div>
    <header>
        <div class="fixed-container">
            <div>
                <a href="#">Услуги</a>
                <a href="#">Портфолио</a>
                <a href="#">Стоимость</a>
            </div>
            <div>
                <span>+7 928 000 24 25</span>
                <button class="ligth-button open-popup">Заказать</button>
            </div>
        </div>
    </header>
    <section>
        <div class="first-block">
            <div>
                <h1>Добро пожаловать!</h1>
                <h2>Мы предлагаем лучшие услуги для вас.</h2>
                <button class="dark-button open-popup">Заказать</button>
            </div>
        </div>
        <div class="services">
            <div>
                <img src="icons/service1.jpg" alt="Услуга 1">
                <div class="price-info">Цена: 2000 руб.</div>
            </div>
            <div>
                <img src="icons/service2.jpg" alt="Услуга 2">
                <div class="price-info">Цена: 3000 руб.</div>
            </div>
            <div>
                <img src="icons/service3.jpg" alt="Услуга 3">
                <div class="price-info">Цена: 2500 руб.</div>
            </div>
        </div>
        <section class="portfolio">
            <h2>Наши работы</h2>
            <div class="works" style="display: flex; justify-content: space-between; margin-top: 20px;">
                <div class="work-item">
                    <img src="icons/work1.jpg" alt="Работа 1">
                </div>
                <div class="work-item">
                    <img src="icons/work2.jpg" alt="Работа 2">
                </div>
                <div class="work-item">
                    <img src="icons/work3.jpg" alt="Работа 3">
                </div>
            </div>
        </section>
    </section>
    <footer>
        <div class="fixed-container">
            <div class="footer-menu">
                <a href="#">Услуги</a>
                <a href="#">Контакты</a>
                <a href="#">Социальные сети</a>
            </div>
            <div class="footer-contacts">
                <p>+7 928 000 24 25</p>
            </div>
            <div class="footer-social">
                <p>Социальные сети</p>
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
            </div>
        </div>
    </footer>
</body>
</html>
